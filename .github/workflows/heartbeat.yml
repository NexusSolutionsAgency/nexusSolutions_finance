# Respaldo del latido de Supabase. El latido principal es el Vercel Cron diario
# (vercel.json); este workflow lo cubre si falla.
#
# Secretos del repo (Settings → Secrets and variables → Actions):
#   CRON_SECRET    → el mismo valor que en Vercel.
#   HEARTBEAT_URL  → URL completa del endpoint, p. ej. https://<proyecto>.vercel.app/api/heartbeat
#
# GitHub desactiva los workflows programados tras 60 días sin commits en el
# repo: ver README («Latido de Supabase») para reactivarlo.
name: Latido de Supabase

on:
  schedule:
    - cron: "30 14 */2 * *" # Cada 2 días, 09:30 hora de Colombia
  workflow_dispatch:

permissions: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar /api/heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$HEARTBEAT_URL" ]; then
            echo "::error::Faltan los secretos CRON_SECRET o HEARTBEAT_URL del repo."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 15 --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${HEARTBEAT_URL}?source=github-action"
